name: Scout — corpus gap analysis

# Fortnightly corpus gap analysis. Scheduled runs propose provisional rows onto
# the Notion Content Prospect List (Status "Proposed — agent") for editorial
# triage; nothing un-flagged ever reaches Notion, and nothing is ever published.
# Manual dispatch defaults to a dry-run so a human test writes nothing unless
# they explicitly choose apply.

on:
  schedule:
    # 06:00 UTC on the 1st and 15th — a low-maintenance fortnightly cadence that
    # tolerates long gaps between runs (no always-on process).
    - cron: '0 6 1,15 * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        type: choice
        default: 'dry-run'
        options:
          - dry-run
          - apply
      max:
        description: 'Max proposals this run'
        type: string
        default: '10'
  # Validate the Scout on PRs that touch it — always a dry-run (writes nothing),
  # so every push gets a green/red signal without a manual dispatch. Scoped to
  # the Scout's own files so unrelated PRs don't trigger a paid agent run.
  pull_request:
    paths:
      - 'scripts/scout/**'
      - '.github/workflows/scout.yml'
      - 'package.json'
      - 'package-lock.json'

concurrency:
  # Per-workflow, per-ref: a new push to a PR supersedes its in-flight dry-run,
  # while scheduled runs (a different ref) stay isolated.
  group: scout-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Fork PRs don't receive secrets, so a dry-run there can only fail — skip
    # them. Same-repo branch PRs (and schedule / dispatch) run normally.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Test the enforcement gate
        run: npm run test:scout

      - name: Resolve run flags
        id: flags
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "args=--apply --max 10" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            # PR validation is always a dry-run — never writes to Notion.
            echo "args=--dry-run --max 10" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.inputs.mode }}" = "apply" ]; then
            echo "args=--apply --max ${{ github.event.inputs.max }}" >> "$GITHUB_OUTPUT"
          else
            echo "args=--dry-run --max ${{ github.event.inputs.max }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Scout
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          # Supabase read-only credentials. Grant the key a read-only role — the
          # Scout only ever issues SELECTs.
          SCOUT_SUPABASE_URL: ${{ secrets.SCOUT_SUPABASE_URL }}
          SCOUT_SUPABASE_KEY: ${{ secrets.SCOUT_SUPABASE_KEY }}
        run: npx tsx scripts/scout/scout.ts ${{ steps.flags.outputs.args }}

name: CI — lint & types

# The design-system contract. `npm run lint` enforces the no-raw-colour-literal
# rule (see .eslintrc.cjs) alongside Next's defaults, so a green PR means no new
# off-palette colour has slipped into a `style` prop — no hand-review of every
# colour needed. Typecheck runs alongside it. A full `next build` is out of
# scope here: it collects page data and so needs Supabase credentials, which
# this gate deliberately doesn't carry (it stays secret-free and fast).

on:
  push:
    branches: [main]
  pull_request:
  # Manual trigger, for the window where a PR shows no checks at all rather
  # than failing ones. Observed on #107: a PR opened through the GitHub MCP
  # server produced no workflow run from its `opened` event — zero runs, every
  # workflow — and sat that way until the next push, whose `synchronize` event
  # did start one. So the gap is real but bounded: a PR opened by an agent and
  # not pushed to again can sit looking unchecked indefinitely, which reads as
  # "not yet" and never resolves. Note the limit — GitHub only offers the
  # dispatch button for workflows present on the DEFAULT branch, so this helps
  # branches cut after it lands, never the PR that adds it.
  #
  # Seen again on #116 (2026-09-21), and the "bounded" reading above held: one
  # push there (d4ca788) produced no run from its `synchronize` event — none,
  # for any workflow, and still none ten minutes later, so a manual dispatch
  # was what produced a green. The NEXT push (a5a2e90) started runs normally.
  # The gap skips a push; it does not persist across them.
  #
  # The trap is in how you CHECK for it, and it is easy to get wrong in the
  # expensive direction. A run takes twenty seconds or so to appear in the API
  # after a push, and during that window the run list looks identical to the
  # gap: no run for your SHA. That false positive happened on #116 — the list
  # was queried seconds after pushing a5a2e90, read as "CI is not firing",
  # reported as such, and answered with a redundant dispatch, leaving the PR
  # with two lint-and-types runs for one commit.
  #
  # So before concluding that a push produced no run: give it a minute, and
  # check the PR's own check runs rather than the workflow list. The check
  # runs are keyed to the head SHA and show the push's run and any dispatch
  # together, which distinguishes "never started" from "not yet indexed". The
  # workflow list alone cannot tell those apart, and the difference decides
  # whether you are fixing a real gap or inventing one.
  workflow_dispatch:

concurrency:
  # New push to a PR supersedes its in-flight run; main runs stay isolated.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-types:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (design tokens + Next defaults)
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      # Pure unit suites — no credentials, no network. A test that never runs in
      # CI is documentation, not a contract, so this runs EVERY suite rather than
      # a chosen few: the comment used to say this while one of seven suites ran.
      - name: Unit tests (all suites)
        run: npm test

      # ...and this proves the line above, instead of asserting it. It fails if
      # any *.test.* file in the repo is not reachable from the npm scripts this
      # workflow invokes — the gap that hid 20 test files, among them a sibling
      # left behind when test:scripture named one file instead of a glob.
      - name: Every test file runs in CI
        run: npm run check:tests-in-ci

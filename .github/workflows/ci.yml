name: CI — lint & types

# The design-system contract. `npm run lint` enforces the no-raw-colour-literal
# rule (see .eslintrc.cjs) alongside Next's defaults, so a green PR means no new
# off-palette colour has slipped into a `style` prop — no hand-review of every
# colour needed. Typecheck runs alongside it. A full `next build` is out of
# scope here: it collects page data and so needs Supabase credentials, which
# this gate deliberately doesn't carry (it stays secret-free and fast).

on:
  push:
    branches: [main]
  pull_request:
  # Manual trigger. A `pull_request` event raised by a GitHub App's token does
  # not start a workflow run — GitHub suppresses it to prevent workflows
  # triggering workflows — so a PR opened by an agent through the App gets no
  # CI at all, which reads as "no checks" rather than as a failure. This lets
  # the run be started by hand against any ref. GitHub only offers the button
  # for workflows present on the default branch, so it works for branches cut
  # after this lands, not retroactively.
  workflow_dispatch:

concurrency:
  # New push to a PR supersedes its in-flight run; main runs stay isolated.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-types:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (design tokens + Next defaults)
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      # Pure unit suites — no credentials, no network. A test that never runs in
      # CI is documentation, not a contract, so this runs EVERY suite rather than
      # a chosen few: the comment used to say this while one of seven suites ran.
      - name: Unit tests (all suites)
        run: npm test

      # ...and this proves the line above, instead of asserting it. It fails if
      # any *.test.* file in the repo is not reachable from the npm scripts this
      # workflow invokes — the gap that hid 20 test files, among them a sibling
      # left behind when test:scripture named one file instead of a glob.
      - name: Every test file runs in CI
        run: npm run check:tests-in-ci
